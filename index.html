<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>H M-r - 図面動線・距離計測</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window['pdfjs-dist/build/pdf']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

<style>
  :root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --accent: #f59e0b;
    --danger: #ef4444;
    --bg-dark: #0b1120;
    --panel-bg: rgba(15, 23, 42, 0.92);
    --text-light: #f8fafc;
    --border-ui: #334155;
  }
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    margin: 0;
    padding: 0;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text-light);
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100dvh;
    position: relative;
  }

  /* 上部ヘッダー */
  header {
    height: 44px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    border-bottom: 1px solid var(--border-ui);
    z-index: 25;
    flex-shrink: 0;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 14px;
  }
  .badge-scale {
    font-size: 11px;
    padding: 2px 6px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 4px;
    color: #38bdf8;
  }
  .header-actions {
    display: flex;
    gap: 6px;
  }

  /* ボタン共通 */
  button, .btn-label {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid var(--border-ui);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active, .btn-label:active {
    background: #334155;
    transform: scale(0.97);
  }
  button.active {
    background: var(--primary);
    border-color: #38bdf8;
    color: #fff;
  }
  button.accent {
    background: #d97706;
    border-color: #f59e0b;
  }
  button.danger {
    background: #991b1b;
    border-color: var(--danger);
  }

  /* メイン作業ビューポート */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1e293b;
    touch-action: none;
  }
  #drawingCanvas {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    cursor: crosshair;
  }

  /* 大型・高視認性 測定距離ウィンドウ */
  #mainDistancePanel {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    border: 2px solid #0284c7;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    padding: 6px 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    z-index: 24;
    pointer-events: auto;
  }
  #statDistance {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #38bdf8;
    letter-spacing: 0.5px;
  }
  #btnUnitToggle {
    font-size: 12px;
    padding: 3px 8px;
    background: #0f172a;
    border: 1px solid #38bdf8;
    color: #f8fafc;
    border-radius: 4px;
  }

  /* 拡大ルーペ（案A照準拡大鏡） */
  #loupe {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px solid #38bdf8;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    pointer-events: none;
    display: none;
    z-index: 100;
    overflow: hidden;
    background: #000;
  }
  #loupeCanvas {
    width: 100%;
    height: 100%;
  }
  .loupe-reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .loupe-cross-v {
    position: absolute;
    width: 1px;
    height: 50px;
    background: #ef4444;
    left: 0;
    top: -25px;
  }
  .loupe-cross-h {
    position: absolute;
    height: 1px;
    width: 50px;
    background: #ef4444;
    top: 0;
    left: -25px;
  }
  .loupe-ring {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px dashed #38bdf8;
    border-radius: 50%;
    top: -8px;
    left: -8px;
  }

  /* D-Pad */
  #dpad {
    position: absolute;
    left: 12px;
    bottom: 100px;
    width: 86px;
    height: 86px;
    background: rgba(15, 23, 42, 0.7);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    z-index: 30;
    backdrop-filter: blur(8px);
  }
  .dbtn {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 11px;
    padding: 0;
  }
  .dbtn:active {
    color: #fff;
    background: rgba(255,255,255,0.2);
  }

  /* ズームコントローラ */
  #zoomControls {
    position: absolute;
    right: 12px;
    bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 30;
  }
  .circle-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    padding: 0;
  }

  /* 下部操作ツールバー */
  #bottomBar {
    background: var(--panel-bg);
    border-top: 1px solid var(--border-ui);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 25;
    backdrop-filter: blur(12px);
  }
  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .mode-selector {
    display: flex;
    flex: 1;
    background: #0f172a;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-ui);
    gap: 4px;
  }
  .mode-selector button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 7px 4px;
    font-size: 12px;
    border-radius: 6px;
  }
  .mode-selector button.active {
    background: var(--primary);
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s, visibility 0.2s;
  }
  .modal-overlay.open {
    visibility: visible;
    opacity: 1;
  }
  .modal-box {
    width: 88%;
    max-width: 360px;
    background: #0f172a;
    border: 1px solid var(--border-ui);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.5);
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #f8fafc;
  }
  .preset-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0;
  }
  .badge-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #38bdf8;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
  }
  .text-input {
    width: 100%;
    padding: 10px;
    background: #1e293b;
    border: 1px solid var(--border-ui);
    color: #fff;
    font-size: 16px;
    border-radius: 6px;
    outline: none;
    margin-bottom: 12px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .toast {
    position: fixed;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(2, 132, 199, 0.95);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
  }
</style>

<body>
<div id="app">
  <!-- 上部ヘッダー -->
  <header>
    <div class="title-area">
      <span>H M-r</span>
      <span id="scaleStatusBadge" class="badge-scale">未校正</span>
    </div>
    <div class="header-actions">
      <label class="btn-label" for="fileInput">📁 図面</label>
      <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none;">

  <!-- キャンバス操作エリア -->
  <div id="viewport">

    <!-- 大型 測定距離表示 -->
    <div id="mainDistancePanel">
      <span id="statDistance">0.00 m</span>

    <!-- 拡大ルーペ（案A） -->

<!-- 縮尺数値入力モーダル -->

<div id="toast" class="toast"></div>

<script>
/**
 * IndexedDB 管理
 */
const DB_NAME = 'HMr_PlanStore';
const DB_VERSION = 1;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('planData')) {
        d.createObjectStore('planData');
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function saveStorage(key, val) {
  if (!db) return;
  const tx = db.transaction('planData', 'readwrite');
  tx.objectStore('planData').put(val, key);
}

function loadStorage(key) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction('planData', 'readonly');
    const req = tx.objectStore('planData').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

// 状態管理
const state = {
  mode: 'corner', // 'corner' | 'trace' | 'view' | 'scale'
  scalePxPerMm: 0,
  unit: 'm', // 'm' | 'mm'
  viewX: 0,
  viewY: 0,
  zoom: 1,
  minZoom: 0.08,
  maxZoom: 8,
  planImage: null,
  planWidth: 0,
  planHeight: 0,
  routes: [],
  currentPoints: [],
  scalePoints: [],
  logs: []
};

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const loupe = document.getElementById('loupe');
const loupeCanvas = document.getElementById('loupeCanvas');
const loupeCtx = loupeCanvas.getContext('2d');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  setTimeout(() => { toastEl.style.opacity = '0'; }, 2200);
}

// iOS Jetsam対策: Canvasサイズクランプ
const MAX_SAFE_CANVAS_DIM = 2400;

function setupCanvasSize(w, h) {
  let scale = 1;
  if (w > MAX_SAFE_CANVAS_DIM || h > MAX_SAFE_CANVAS_DIM) {
    scale = Math.min(MAX_SAFE_CANVAS_DIM / w, MAX_SAFE_CANVAS_DIM / h);
  }
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  state.planWidth = canvas.width;
  state.planHeight = canvas.height;
}

function render() {
  if (!state.planWidth) return;

  canvas.style.transform = `translate(${state.viewX}px, ${state.viewY}px) scale(${state.zoom})`;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state.planImage) {
    ctx.drawImage(state.planImage, 0, 0, canvas.width, canvas.height);
  }

  // 確定済みルート
  state.routes.forEach(route => {
    drawPath(route.points, '#0284c7', 3.5 / state.zoom);
  });

  // 計測中ルート
  if (state.currentPoints.length > 0) {
    drawPath(state.currentPoints, '#38bdf8', 3.5 / state.zoom, true);
  }

  // 縮尺2点
  if (state.scalePoints.length > 0) {
    drawScaleMarkers();
  }

  updateStats();
}

function drawPath(pts, color, lineWidth, active = false) {
  if (pts.length === 0) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(lineWidth, 2);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();

  pts.forEach((pt, idx) => {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(4.5 / state.zoom, 3), 0, Math.PI * 2);
    ctx.fillStyle = active && idx === pts.length - 1 ? '#ef4444' : '#38bdf8';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5 / state.zoom;
    ctx.stroke();
  });
  ctx.restore();
}

function drawScaleMarkers() {
  ctx.save();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 3 / state.zoom;
  ctx.setLineDash([6 / state.zoom, 4 / state.zoom]);

  if (state.scalePoints.length === 2) {
    ctx.beginPath();
    ctx.moveTo(state.scalePoints[0].x, state.scalePoints[0].y);
    ctx.lineTo(state.scalePoints[1].x, state.scalePoints[1].y);
    ctx.stroke();
  }

  ctx.setLineDash([]);
  state.scalePoints.forEach((pt, i) => {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 6 / state.zoom, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 / state.zoom;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(13 / state.zoom, 11)}px sans-serif`;
    ctx.fillText(`P${i+1}`, pt.x + 8 / state.zoom, pt.y - 8 / state.zoom);
  });
  ctx.restore();
}

/**
 * 案A：マイクロ吸着
 */
function snapToIntersection(targetX, targetY) {
  const radius = 15;
  const startX = Math.max(0, Math.floor(targetX - radius));
  const startY = Math.max(0, Math.floor(targetY - radius));
  const size = radius * 2;

  if (startX + size > canvas.width || startY + size > canvas.height) {
    return { x: targetX, y: targetY };
  }

  try {
    const imgData = ctx.getImageData(startX, startY, size, size);
    const data = imgData.data;
    let sumX = 0, sumY = 0, count = 0;

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const idx = (y * size + x) * 4;
        const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
        if (brightness < 120) {
          sumX += x;
          sumY += y;
          count++;
        }
      }
    }

    if (count > 10 && count < (size * size * 0.7)) {
      const cx = startX + (sumX / count);
      const cy = startY + (sumY / count);
      return { x: Math.round(cx * 10) / 10, y: Math.round(cy * 10) / 10 };
    }
  } catch (e) {}
  return { x: targetX, y: targetY };
}

function updateLoupe(screenX, screenY, canvasX, canvasY) {
  loupe.style.display = 'block';
  const offsetTop = 75;
  const offsetLeft = 20;
  let posX = screenX + offsetLeft;
  let posY = screenY - offsetTop - 140;

  if (posY < 10) posY = screenY + 30;
  if (posX + 140 > window.innerWidth) posX = screenX - 160;

  loupe.style.left = `${posX}px`;
  loupe.style.top = `${posY}px`;

  const zoomFactor = 2.5;
  const sampleSize = 140 / zoomFactor;
  loupeCtx.clearRect(0, 0, 140, 140);
  loupeCtx.imageSmoothingEnabled = false;

  loupeCtx.drawImage(
    canvas,
    canvasX - sampleSize / 2, canvasY - sampleSize / 2, sampleSize, sampleSize,
    0, 0, 140, 140
  );
}

function hideLoupe() {
  loupe.style.display = 'none';
}

function getCanvasCoords(clientX, clientY) {
  const rect = viewport.getBoundingClientRect();
  const x = (clientX - rect.left - state.viewX) / state.zoom;
  const y = (clientY - rect.top - state.viewY) / state.zoom;
  return { x, y };
}

/**
 * タッチ・ポインター制御（暴発防止＆高精度ピンチズーム）
 */
let isPointerDown = false;
let startPointerPos = { x: 0, y: 0 };
let lastPointerPos = { x: 0, y: 0 };
let isMultiTouch = false;
let pinchStartDistance = 0;
let pinchStartZoom = 1;
let pinchCenter = { x: 0, y: 0 };
let pinchCenterCanvas = { x: 0, y: 0 };

// ピンチイン・アウト（中心位置固定ズーム）
viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length >= 2) {
    isMultiTouch = true;
    hideLoupe();

    const t1 = e.touches[0];
    const t2 = e.touches[1];
    pinchStartDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    pinchStartZoom = state.zoom;

    // 2指の中心スクリーン座標
    pinchCenter = {
      x: (t1.clientX + t2.clientX) / 2,
      y: (t1.clientY + t2.clientY) / 2
    };
    // 中心座標における図面上の相対点（ここを中心に拡大する）
    const rect = viewport.getBoundingClientRect();
    pinchCenterCanvas = {
      x: (pinchCenter.x - rect.left - state.viewX) / state.zoom,
      y: (pinchCenter.y - rect.top - state.viewY) / state.zoom
    };
  }
}, { passive: true });

viewport.addEventListener('touchmove', (e) => {
  if (isMultiTouch && e.touches.length >= 2) {
    const t1 = e.touches[0];
    const t2 = e.touches[1];
    const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    if (pinchStartDistance > 0) {
      const scaleFactor = currentDist / pinchStartDistance;
      const targetZoom = Math.min(Math.max(pinchStartZoom * scaleFactor, state.minZoom), state.maxZoom);

      // 新しい2指の中心位置
      const currentCenter = {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
      };

      const rect = viewport.getBoundingClientRect();
      // 指の間を中心にしてブレずに拡大・移動
      state.zoom = targetZoom;
      state.viewX = (currentCenter.x - rect.left) - pinchCenterCanvas.x * targetZoom;
      state.viewY = (currentCenter.y - rect.top) - pinchCenterCanvas.y * targetZoom;

      render();
    }
  }
}, { passive: true });

viewport.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) {
    // 2本指から指が離れた直後の誤打点を防ぐためのウェイト
    setTimeout(() => { isMultiTouch = false; }, 120);
  }
}, { passive: true });

// 単一ポインター（角タップ・なぞり・ドラッグ移動）
viewport.addEventListener('pointerdown', (e) => {
  if (isMultiTouch) return;
  if (e.target !== canvas && e.target !== viewport) return;

  isPointerDown = true;
  startPointerPos = { x: e.clientX, y: e.clientY };
  lastPointerPos = { x: e.clientX, y: e.clientY };

  const coords = getCanvasCoords(e.clientX, e.clientY);

  if (state.mode === 'scale' || state.mode === 'corner') {
    const snapped = snapToIntersection(coords.x, coords.y);
    updateLoupe(e.clientX, e.clientY, snapped.x, snapped.y);
  } else if (state.mode === 'trace') {
    state.currentPoints.push({ x: coords.x, y: coords.y });
    render();
  }
});

viewport.addEventListener('pointermove', (e) => {
  if (!isPointerDown || isMultiTouch) return;

  const moveDist = Math.hypot(e.clientX - startPointerPos.x, e.clientY - startPointerPos.y);

  if (state.mode === 'view') {
    const dx = e.clientX - lastPointerPos.x;
    const dy = e.clientY - lastPointerPos.y;
    state.viewX += dx;
    state.viewY += dy;
    lastPointerPos = { x: e.clientX, y: e.clientY };
    render();
    return;
  }

  const coords = getCanvasCoords(e.clientX, e.clientY);

  if (state.mode === 'scale' || state.mode === 'corner') {
    // ドラッグ移動中もルーペを追従更新
    const snapped = snapToIntersection(coords.x, coords.y);
    updateLoupe(e.clientX, e.clientY, snapped.x, snapped.y);
  } else if (state.mode === 'trace') {
    state.currentPoints.push({ x: coords.x, y: coords.y });
    render();
  }
});

viewport.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  hideLoupe();

  if (isMultiTouch) return;

  // 暴発防止ガード: 移動距離が8px以上のスワイプ動作は「角タップ」として打点しない
  const totalMove = Math.hypot(e.clientX - startPointerPos.x, e.clientY - startPointerPos.y);
  if (state.mode === 'corner' && totalMove > 8) {
    return; // スクロールや誤ドラッグと判定しスキップ
  }

  const coords = getCanvasCoords(e.clientX, e.clientY);

  if (state.mode === 'scale') {
    const snapped = snapToIntersection(coords.x, coords.y);
    state.scalePoints.push(snapped);
    render();
    if (state.scalePoints.length === 2) {
      openScaleModal();
    }
  } else if (state.mode === 'corner') {
    const snapped = snapToIntersection(coords.x, coords.y);
    state.currentPoints.push(snapped);
    render();
  }
});

/**
 * 距離計算・表示更新
 */
function calculateDistance(pts) {
  if (pts.length < 2) return 0;
  let pxTotal = 0;
  for (let i = 1; i < pts.length; i++) {
    pxTotal += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  if (!state.scalePxPerMm) return pxTotal;
  return pxTotal / state.scalePxPerMm;
}

function updateStats() {
  const mm = calculateDistance(state.currentPoints);
  const statEl = document.getElementById('statDistance');
  if (!state.scalePxPerMm) {
    statEl.textContent = `${Math.round(mm)} px`;
    return;
  }
  if (state.unit === 'm') {
    statEl.textContent = `${(mm / 1000).toFixed(2)} m`;
  } else {
    statEl.textContent = `${Math.round(mm)} mm`;
  }
}

/**
 * ファイル読込（PDF / 画像）
 */
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  showToast('図面を読み込み中...');

  if (file.type === 'application/pdf') {
    const reader = new FileReader();
    reader.onload = async function() {
      const typedarray = new Uint8Array(this.result);
      try {
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        const page = await pdf.getPage(1);
        const viewportDef = page.getViewport({ scale: 1.5 });

        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        offCanvas.width = viewportDef.width;
        offCanvas.height = viewportDef.height;

        await page.render({ canvasContext: offCtx, viewport: viewportDef }).promise;
        const img = new Image();
        img.onload = () => { applyLoadedPlan(img, img.src); };
        img.src = offCanvas.toDataURL('image/jpeg', 0.85);
      } catch (err) {
        alert('PDF読込エラー: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = () => { applyLoadedPlan(img, evt.target.result); };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }
});

function applyLoadedPlan(img, rawDataUrl) {
  setupCanvasSize(img.width, img.height);
  state.planImage = img;
  state.viewX = 0;
  state.viewY = 0;
  state.zoom = Math.min(viewport.clientWidth / img.width, viewport.clientHeight / img.height, 1);
  state.routes = [];
  state.currentPoints = [];
  render();
  saveStorage('savedPlan', rawDataUrl);
  showToast('図面読込完了');
}

/**
 * 縮尺設定モーダル
 */
const scaleModal = document.getElementById('scaleModal');
const scaleInputMm = document.getElementById('scaleInputMm');

function openScaleModal() {
  scaleInputMm.value = '';
  scaleModal.classList.add('open');
}

document.querySelectorAll('.badge-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    scaleInputMm.value = btn.dataset.val;
  });
});

document.getElementById('btnConfirmScale').addEventListener('click', () => {
  const mmVal = parseFloat(scaleInputMm.value);
  if (!mmVal || mmVal <= 0) {
    alert('有効な数値を入力してください');
    return;
  }
  const p1 = state.scalePoints[0];
  const p2 = state.scalePoints[1];
  const pxDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

  state.scalePxPerMm = pxDist / mmVal;
  saveStorage('scalePxPerMm', state.scalePxPerMm);

  scaleModal.classList.remove('open');
  state.scalePoints = [];
  setMode('corner');
  document.getElementById('scaleStatusBadge').textContent = `1m = ${(state.scalePxPerMm * 1000).toFixed(1)}px`;
  showToast('縮尺を設定しました');
  render();
});

document.getElementById('btnCancelScale').addEventListener('click', () => {
  scaleModal.classList.remove('open');
  state.scalePoints = [];
  setMode('corner');
  render();
});

/**
 * モード切替
 */
function setMode(newMode) {
  state.mode = newMode;
  ['modeCorner', 'modeTrace', 'modeView'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  if (newMode === 'corner') document.getElementById('modeCorner').classList.add('active');
  if (newMode === 'trace') document.getElementById('modeTrace').classList.add('active');
  if (newMode === 'view') document.getElementById('modeView').classList.add('active');
}

document.getElementById('modeCorner').addEventListener('click', () => setMode('corner'));
document.getElementById('modeTrace').addEventListener('click', () => setMode('trace'));
document.getElementById('modeView').addEventListener('click', () => setMode('view'));

document.getElementById('btnSetScale').addEventListener('click', () => {
  state.mode = 'scale';
  state.scalePoints = [];
  showToast('基準となる2点を指定してください');
  render();
});

// 操作ボタン
document.getElementById('btnUndo').addEventListener('click', () => {
  if (state.currentPoints.length > 0) {
    state.currentPoints.pop();
  } else if (state.routes.length > 0) {
    state.routes.pop();
  }
  render();
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (confirm('計測線路をすべて消去しますか？')) {
    state.currentPoints = [];
    state.routes = [];
    render();
  }
});

document.getElementById('btnUnitToggle').addEventListener('click', () => {
  state.unit = state.unit === 'm' ? 'mm' : 'm';
  document.getElementById('btnUnitToggle').textContent = state.unit;
  updateStats();
});

// 記録保存 & ログ
document.getElementById('btnSaveLog').addEventListener('click', () => {
  if (state.currentPoints.length < 2) {
    showToast('計測点が不足しています');
    return;
  }
  const dist = calculateDistance(state.currentPoints);
  const formatted = state.scalePxPerMm
    ? (state.unit === 'm' ? `${(dist / 1000).toFixed(2)} m` : `${Math.round(dist)} mm`)
    : `${Math.round(dist)} px`;

  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const entry = `[${timeStr}] 計測: ${formatted} (点数: ${state.currentPoints.length})`;

  state.logs.push(entry);
  state.routes.push({ points: [...state.currentPoints] });
  state.currentPoints = [];
  saveStorage('logs', state.logs);
  showToast('記録を保存しました');
  render();
});

const logModal = document.getElementById('logModal');
document.getElementById('btnLogModal').addEventListener('click', () => {
  const logList = document.getElementById('logList');
  if (state.logs.length === 0) {
    logList.innerHTML = '<p style="color:#64748b;">記録がありません</p>';
  } else {
    logList.innerHTML = state.logs.map((l, i) => `<div>${i+1}. ${l}</div>`).join('');
  }
  logModal.classList.add('open');
});
document.getElementById('btnCloseLog').addEventListener('click', () => logModal.classList.remove('open'));

document.getElementById('btnCopyLog').addEventListener('click', () => {
  if (state.logs.length === 0) return;
  navigator.clipboard.writeText(state.logs.join('\n')).then(() => {
    showToast('ログをコピーしました');
  });
});

// D-Pad パン操作
document.querySelectorAll('.dbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.pan;
    const step = 45;
    if (dir === 'up') state.viewY += step;
    if (dir === 'down') state.viewY -= step;
    if (dir === 'left') state.viewX += step;
    if (dir === 'right') state.viewX -= step;
    render();
  });
});

// ズームボタン操作
document.getElementById('btnZoomIn').addEventListener('click', () => {
  const cx = viewport.clientWidth / 2;
  const cy = viewport.clientHeight / 2;
  const targetZoom = Math.min(state.zoom * 1.3, state.maxZoom);
  state.viewX = cx - (cx - state.viewX) * (targetZoom / state.zoom);
  state.viewY = cy - (cy - state.viewY) * (targetZoom / state.zoom);
  state.zoom = targetZoom;
  render();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  const cx = viewport.clientWidth / 2;
  const cy = viewport.clientHeight / 2;
  const targetZoom = Math.max(state.zoom / 1.3, state.minZoom);
  state.viewX = cx - (cx - state.viewX) * (targetZoom / state.zoom);
  state.viewY = cy - (cy - state.viewY) * (targetZoom / state.zoom);
  state.zoom = targetZoom;
  render();
});
document.getElementById('btnZoomReset').addEventListener('click', () => {
  if (!state.planWidth) return;
  state.viewX = 0;
  state.viewY = 0;
  state.zoom = Math.min(viewport.clientWidth / state.planWidth, viewport.clientHeight / state.planHeight, 1);
  render();
});

/**
 * ページ起動時：IndexedDB復元
 */
window.addEventListener('DOMContentLoaded', async () => {
  await initDB();
  const savedScale = await loadStorage('scalePxPerMm');
  if (savedScale) {
    state.scalePxPerMm = savedScale;
    document.getElementById('scaleStatusBadge').textContent = `1m = ${(savedScale * 1000).toFixed(1)}px`;
  }
  const savedLogs = await loadStorage('logs');
  if (savedLogs) {
    state.logs = savedLogs;
  }
  const savedPlan = await loadStorage('savedPlan');
  if (savedPlan) {
    const img = new Image();
    img.onload = () => {
      setupCanvasSize(img.width, img.height);
      state.planImage = img;
      state.zoom = Math.min(viewport.clientWidth / img.width, viewport.clientHeight / img.height, 1);
      render();
      showToast('前回の図面を復元しました');
    };
    img.src = savedPlan;
  }
});
</script>
</body>
</html>
